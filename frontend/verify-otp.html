<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify phone — GigsUp</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">G</span> Gigs<span class="accent">Up</span></a><main class="verify-card"><span class="eyebrow">ONE MORE STEP</span><h1>Verify your phone</h1><p class="muted">Enter the six-digit code sent to your phone number.</p><form id="otpForm" class="auth-form"><div id="formMessage" class="message hidden"></div><label for="otpPhone">Phone number</label><input id="otpPhone" type="tel" placeholder="+919876543210" required><label for="otp">Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit code" required><button class="btn btn-primary full-width" type="submit">Verify phone →</button></form><button id="resendOtp" class="btn btn-outline full-width resend-button" type="button">Resend code</button><p class="form-foot"><a class="text-link" href="register.html">← Back to registration</a></p></main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
